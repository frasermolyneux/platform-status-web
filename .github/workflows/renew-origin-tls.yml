name: Renew Status Origin TLS

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions: {}

jobs:
  renew:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: status-secret-bootstrap
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Renew only when the certificate is missing or due
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: python3 deployment/bootstrap_origin_tls.py
