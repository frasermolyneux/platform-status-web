name: Build and Test

on:
  push:
    branches: [main, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

concurrency:
  group: service-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
      - name: Build and test backend
        run: dotnet test src/MX.Platform.Status.slnx --configuration Release --nologo
      - name: Check runtime provisioning and publication gates
        run: python3 -m unittest discover -s deployment -p 'test_*.py'
      - name: Build and check frontend
        working-directory: src/MX.Platform.Status.Web
        run: npm ci && npm test && npm run build && npx tsc --noEmit
      - name: Build constrained runtime images
        run: |
          docker build --tag status-service:ci .
          docker build --file deployment/postgres.Dockerfile --tag status-postgres:ci .
      - name: Exercise primary, standby, and persisted public serving
        run: python3 deployment/integration_test.py
