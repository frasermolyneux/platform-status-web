name: Publish Status Images

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  validate-contract:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Create read-only platform contract token
        id: platform-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: platform-baremetal
          permission-contents: read
      - name: Check out approved private platform contract
        uses: actions/checkout@v7
        with:
          repository: frasermolyneux/platform-baremetal
          ref: 285d279cfd99bbc28498068246f8c0affe99b848
          path: .platform-contract
          token: ${{ steps.platform-token.outputs.token }}
          persist-credentials: false
      - name: Validate constrained workload contract
        uses: ./.platform-contract/.github/actions/validate-workload-manifest
        with:
          policy-path: .github/validation/policy.json

  publish:
    needs: validate-contract
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: status-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Detect image input changes
        id: inputs
        env:
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [[ "$FORCE_PUBLISH" == true ]] ||
            grep --extended-regexp --quiet '^(Dockerfile$|\.dockerignore$|src/|deployment/postgres[-.]|\.github/workflows/deploy-prd\.yml$)' <<<"$changed"; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "No image inputs changed; retaining the published image digests." >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: azure/login@v3
        if: steps.inputs.outputs.publish == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish immutable application and database images
        if: steps.inputs.outputs.publish == 'true'
        env:
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name acr7ca0fd3326df
          for image in service postgres; do
            target="acr7ca0fd3326df.azurecr.io/workloads/platform-status-${image}"
            dockerfile=Dockerfile
            if [[ "$image" == postgres ]]; then dockerfile=deployment/postgres.Dockerfile; fi
            docker build --file "$dockerfile" --tag "${target}:sha-${IMAGE_REVISION}" .
            docker push "${target}:sha-${IMAGE_REVISION}"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${target}:sha-${IMAGE_REVISION}")"
            printf '%s\n' "$digest" >"${image}-image.txt"
            printf '%s\n' "$digest" >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: steps.inputs.outputs.publish == 'true'
        with:
          name: status-image-digests
          path: "*-image.txt"
          retention-days: 30
