name: Publish Status Images

on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: status-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish immutable application and database images
        env:
          IMAGE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name acr7ca0fd3326df
          for image in service postgres; do
            target="acr7ca0fd3326df.azurecr.io/workloads/platform-status-${image}"
            dockerfile=Dockerfile
            if [[ "$image" == postgres ]]; then dockerfile=deployment/postgres.Dockerfile; fi
            docker build --file "$dockerfile" --tag "${target}:sha-${IMAGE_REVISION}" .
            docker push "${target}:sha-${IMAGE_REVISION}"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${target}:sha-${IMAGE_REVISION}")"
            printf '%s\n' "$digest" >"${image}-image.txt"
            printf '%s\n' "$digest" >>"$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: status-image-digests
          path: "*-image.txt"
          retention-days: 30
