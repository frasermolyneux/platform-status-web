name: Destroy Development

on:
  workflow_dispatch:

permissions: {}

jobs:
  terraform-destroy:
    if: vars.LEGACY_AZURE_RETIREMENT_APPROVED == 'true'
    permissions:
      contents: read
      id-token: write
    environment: Development
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-dev
    steps:
      - uses: frasermolyneux/actions/terraform-destroy@027d7e31bb32b734090aaed01b36d74f1d658b61 # terraform-destroy/v3.0.0
        with:
          terraform-folder: "terraform"
          terraform-version: "1.17.0"
          terraform-var-file: "tfvars/dev.tfvars"
          terraform-backend-file: "backends/dev.backend.hcl"
          terraform-additional-args: '-var="github_app_id=${{ vars.GH_APP_ID }}" -var="github_app_installation_id=${{ vars.GH_APP_INSTALLATION_ID }}"'
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        env:
          TF_VAR_github_app_pem: ${{ secrets.GH_APP_PEM }}