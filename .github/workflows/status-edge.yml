name: Status Edge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "edge/**"
      - ".github/workflows/status-edge.yml"
      - "deployment/validate_edge_plan.py"
      - "deployment/test_validate_edge_plan.py"
      - "deployment/activate_edge.py"
      - "deployment/test_activate_edge.py"
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, reconcile reviewed main, enable only the staged LB, or verify health
        type: choice
        options: [plan, apply, activate, verify, maps-tls-plan, maps-tls]
        default: plan
        required: true

permissions: {}

concurrency:
  group: status-edge-prd
  cancel-in-progress: false

jobs:
  edge:
    if: >-
      github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository ||
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_AZUREAD: "true"
      ARM_USE_OIDC: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: frasermolyneux/actions/terraform-setup@terraform-setup/v1.0.0
        id: setup
        with:
          terraform-folder: edge
          terraform_wrapper: "false"
      - name: Check edge formatting
        run: terraform -chdir=edge fmt -check -recursive
      - name: Initialize isolated edge state
        run: |
          set -euo pipefail
          terraform -chdir=edge init -lockfile=readonly -input=false \
            -backend-config=../terraform/backends/prd.backend.hcl \
            -backend-config=backends/prd.backend.hcl
          jq -e '.backend.config.key == "status-edge-prd.tfstate"' edge/.terraform/terraform.tfstate
      - name: Validate edge configuration
        run: terraform -chdir=edge validate
      - name: Plan only Cloudflare edge resources
        id: plan
        if: github.event_name == 'pull_request' || inputs.operation != 'verify'
        run: |
          set -euo pipefail
          mode=()
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.operation }}" == "activate" ]]; then
            mode=(-refresh-only)
          fi
          terraform -chdir=edge plan "${mode[@]}" -input=false -lock-timeout=5m -out=edge.tfplan
          terraform -chdir=edge show -no-color edge.tfplan > "$RUNNER_TEMP/status-edge-plan.txt"
          {
            echo '## Status edge plan'
            echo '```terraform'
            cat "$RUNNER_TEMP/status-edge-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce the reviewed preflight or reconciliation boundary
        if: github.event_name == 'pull_request' || inputs.operation != 'verify'
        run: |
          mode=--activate
          if [[ "${{ inputs.operation }}" == "maps-tls-plan" || "${{ inputs.operation }}" == "maps-tls" ]]; then
            mode=--maps-tls
          elif [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.operation }}" == "activate" ]]; then
            mode=--prepare-activation
          fi
          terraform -chdir=edge show -json edge.tfplan | python3 deployment/validate_edge_plan.py "$mode"
      - name: Retain bounded edge plan execution evidence
        if: always() && !cancelled() && contains(fromJSON('["success","failure"]'), steps.plan.outcome)
        uses: frasermolyneux/actions/terraform-receipt@terraform-receipt/v1.0.0
        with:
          context-directory: ${{ steps.setup.outputs.directory }}
          operation: plan
          outcome: ${{ steps.plan.outcome == 'success' && 'success' || 'failure' }}
          environment: prd
      - name: Enable only the existing healthy shared load balancer
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'activate'
        run: python3 deployment/activate_edge.py
      - name: Reconcile Terraform after the enablement-only API patch
        id: reconcile-apply
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'activate'
        run: |
          set -euo pipefail
          terraform -chdir=edge plan -input=false -lock-timeout=5m -out=edge.tfplan
          terraform -chdir=edge show -json edge.tfplan | python3 deployment/validate_edge_plan.py --activate
          terraform -chdir=edge apply -input=false edge.tfplan
      - name: Apply reviewed main configuration
        id: reviewed-apply
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["apply","maps-tls"]'), inputs.operation)
        run: terraform -chdir=edge apply -input=false edge.tfplan
      - name: Retain bounded edge apply execution evidence
        if: >-
          always() && !cancelled() &&
          (contains(fromJSON('["success","failure"]'), steps.reconcile-apply.outcome) ||
           contains(fromJSON('["success","failure"]'), steps.reviewed-apply.outcome))
        uses: frasermolyneux/actions/terraform-receipt@terraform-receipt/v1.0.0
        with:
          context-directory: ${{ steps.setup.outputs.directory }}
          operation: apply
          outcome: ${{ (steps.reconcile-apply.outcome == 'success' || steps.reviewed-apply.outcome == 'success') && 'success' || 'failure' }}
          environment: prd
      - name: Publish edge verification identifiers
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["apply","activate","verify"]'), inputs.operation)
        run: terraform -chdir=edge output -json status_edge >> "$GITHUB_STEP_SUMMARY"
      - name: Read live Cloudflare origin health without changing routing
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && contains(fromJSON('["apply","activate","verify"]'), inputs.operation)
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          edge = json.loads(subprocess.check_output(
              ["terraform", "-chdir=edge", "output", "-json", "status_edge"], text=True))
          base = f"https://api.cloudflare.com/client/v4/accounts/{edge['account_id']}/load_balancers"
          for suffix in (f"/pools/{edge['pool_id']}", f"/monitors/{edge['monitor_id']}",
                         f"/pools/{edge['pool_id']}/health"):
              request = Request(base + suffix,
                  headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]})
              try:
                  with urlopen(request, timeout=30) as response:
                      result = json.load(response)
              except HTTPError as error:
                  try:
                      details = json.load(error)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      diagnostic = "No structured JSON error details were returned."
                  else:
                      diagnostic = (json.dumps(details.get("errors", [])) if isinstance(details, dict)
                                    else "The JSON error response was not an object.")
                  raise RuntimeError(
                      f"Cloudflare verification failed at {suffix}: HTTP {error.code}; "
                      + diagnostic) from error
              if result["success"] is not True:
                  raise RuntimeError("Cloudflare verification failed: " + json.dumps(result["errors"]))
              report = json.dumps(result["result"], indent=2)
              print(suffix + "\n" + report)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"\n## Cloudflare verification: {suffix}\n```json\n" + report + "\n```\n")
          PY
      - name: Remove transient edge plan files
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/edge/edge.tfplan" "$RUNNER_TEMP/status-edge-plan.txt"
