name: Bot Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dependabot-policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    outputs:
      auto_merge_allowed: ${{ steps.evaluate.outputs.auto_merge_allowed }}
    steps:
      - name: Evaluate auto-merge policy
        id: evaluate
        uses: frasermolyneux/actions/dependabot-policy@dependabot-policy/v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  auto-merge:
    needs:
      - dependabot-policy
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ needs.dependabot-policy.outputs.auto_merge_allowed == 'true' }}
    steps:
      - name: Enable auto-merge for approved bot PRs
        run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh-auto-merge-branches:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: bot-auto-merge-refresh
      cancel-in-progress: false
    steps:
      - name: Refresh stale approved bot branches
        shell: bash
        run: |
          set -euo pipefail

          pr_numbers=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,author,mergeStateStatus,autoMergeRequest \
            --jq '.[] | select(
              (
                .author.login == "app/dependabot" or
                .author.login == "dependabot[bot]" or
                .author.login == "mx-io-idp-bot" or
                .author.login == "mx-io-idp-bot[bot]"
              ) and
              .mergeStateStatus == "BEHIND" and
              .autoMergeRequest != null
            ) | .number')

          failed=0
          while read -r pr_number; do
            [[ -z "$pr_number" ]] && continue
            echo "Refreshing approved bot PR #$pr_number"
            if ! gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/update-branch"; then
              echo "::error::Failed to refresh approved bot PR #$pr_number"
              failed=1
            fi
          done <<< "$pr_numbers"

          exit "$failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
