name: Dependabot Auto-Merge
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dependabot-policy:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    outputs:
      is_dependabot: ${{ steps.evaluate.outputs.is_dependabot }}
      auto_merge_allowed: ${{ steps.evaluate.outputs.auto_merge_allowed }}
    steps:
      - name: Evaluate Dependabot policy
        id: evaluate
        uses: frasermolyneux/actions/dependabot-policy@dependabot-policy/v1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  dependabot:
    needs:
      - dependabot-policy
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ needs.dependabot-policy.outputs.is_dependabot == 'true' && needs.dependabot-policy.outputs.auto_merge_allowed == 'true' }}
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  refresh-auto-merge-branches:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: dependabot-auto-merge-refresh
      cancel-in-progress: false
    steps:
      - name: Refresh stale Dependabot branches
        shell: bash
        run: |
          set -euo pipefail

          pr_numbers=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --limit 100 \
            --json number,author,mergeStateStatus,autoMergeRequest \
            --jq '.[] | select(
              (
                .author.login == "app/dependabot" or
                .author.login == "dependabot[bot]"
              ) and
              .mergeStateStatus == "BEHIND" and
              .autoMergeRequest != null
            ) | .number')

          failed=0
          while read -r pr_number; do
            [[ -z "$pr_number" ]] && continue
            echo "Refreshing Dependabot PR #$pr_number"
            if ! gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/update-branch"; then
              echo "::error::Failed to refresh Dependabot PR #$pr_number"
              failed=1
            fi
          done <<< "$pr_numbers"

          exit "$failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
